<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Баннер «Бархатный сезон» — макет</title>
  <link rel="stylesheet" href="banner.css">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      padding: 32px;
      background: #ededed;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .preview-wrap { width: min(1460px, 100%); margin: auto; }
    @media (max-width: 680px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <main class="preview-wrap">
    <a
      class="season-banner"
      href="https://belokurikha.ru/sales/barhatnyj-sezon/"
      aria-label="Открыть страницу акции «Бархатный сезон в Белокурихе»"
    >
      <span class="season-photo" role="img" aria-label="Пара отдыхает у горной реки в Белокурихе"></span>
      <span class="season-gradient" aria-hidden="true"></span>
      <span class="season-content">
        <span class="season-date">
          <svg class="season-leaf" viewBox="0 0 24 28" aria-hidden="true">
            <path d="M20.5 2.5C13 5.8 5 9.2 4.2 17.1c-.5 4.9 3.2 8.5 7.8 8.4 7.3-.2 10.4-8.8 8.5-23Z"/>
            <path d="M5.2 22.8c3.1-5.8 7.2-10 12.4-13.1"/>
          </svg>
          <span>1 сентября — 25 октября</span>
        </span>
        <span class="season-title">Бархатный<br>сезон</span>
        <span class="season-place">в Белокурихе</span>
        <span class="season-copy">Золотая осень Алтая — время для прогулок, SPA и восстановления без летней суеты.</span>
        <span class="season-features" aria-label="Преимущества сезона">
          <span>Прогулки</span><span>Бассейны</span><span>SPA</span><span>События</span>
        </span>
        <span class="season-action">Открыть сезон <span aria-hidden="true">→</span></span>
      </span>
    </a>
  </main>
</body>
</html>
