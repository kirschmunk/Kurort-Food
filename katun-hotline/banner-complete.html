/* Fluid component: insert inside the site's existing content container. */
.kt-hotline-slot {
  container: kt-hotline / inline-size;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.kt-hotline-slot .kt-hotline,
.kt-hotline-slot .kt-hotline * {
  box-sizing: border-box;
}

.kt-hotline-slot .kt-hotline {
  display: grid;
  grid-template-columns: 52px minmax(0, 500px) auto;
  align-items: center;
  justify-content: center;
  gap: 24px;
  width: 100%;
  margin: 0;
  padding: 34px 32px;
  border: 1px solid #d8eade;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 6px 22px #185c4108;
  color: #2e3038;
  font: 400 14px/1.5 "KT Hotline Acrom", Arial, sans-serif;
  text-align: left;
}

.kt-hotline-slot .kt-hotline__icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #eaf7f0;
  color: #00865a;
}

.kt-hotline-slot .kt-hotline__icon svg {
  display: block;
  width: 26px;
  height: 26px;
}

.kt-hotline-slot .kt-hotline__title {
  margin: 0;
  padding: 0;
  color: #2e3038;
  font: 700 26px/1.25 "KT Hotline Acrom", Arial, sans-serif;
  letter-spacing: -.6px;
  text-transform: none;
  text-align: left;
}

.kt-hotline-slot .kt-hotline__description {
  max-width: none;
  margin: 7px 0 0;
  padding: 0;
  color: #677482;
  font: 400 15px/1.55 "KT Hotline Acrom", Arial, sans-serif;
  letter-spacing: normal;
  text-align: left;
}

.kt-hotline-slot .kt-hotline__contact {
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  gap: 6px 12px;
  min-width: max-content;
}

.kt-hotline-slot .kt-hotline__call {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 54px;
  margin: 0;
  padding: 14px 22px;
  border: 0;
  border-radius: 9px;
  background: #00865a;
  color: #fff;
  font: 700 20px/1.3 "KT Hotline Acrom", Arial, sans-serif;
  letter-spacing: -.35px;
  text-decoration: none;
  text-transform: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .18s ease, box-shadow .18s ease;
}

.kt-hotline-slot .kt-hotline__call:visited {
  color: #fff;
}

.kt-hotline-slot .kt-hotline__call:hover {
  background: #006f4b;
  color: #fff;
  text-decoration: none;
  box-shadow: 0 4px 14px #00865a24;
}

.kt-hotline-slot .kt-hotline__call:focus-visible {
  outline: 3px solid #00865a;
  outline-offset: 4px;
}

.kt-hotline-slot .kt-hotline__max {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 54px;
  margin: 0;
  padding: 13px 17px;
  border: 1px solid #ded9f3;
  border-radius: 9px;
  background: #f8f7fc;
  color: #45356d;
  font: 700 16px/1.3 "KT Hotline Acrom", Arial, sans-serif;
  letter-spacing: normal;
  text-decoration: none;
  text-transform: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .18s ease, border-color .18s ease;
}

.kt-hotline-slot .kt-hotline__max:visited { color: #45356d; }

.kt-hotline-slot .kt-hotline__max:hover {
  background: #efebfb;
  border-color: #c7bce9;
  color: #45356d;
  text-decoration: none;
}

.kt-hotline-slot .kt-hotline__max:focus-visible {
  outline: 3px solid #6846ca;
  outline-offset: 4px;
}

.kt-hotline-slot .kt-hotline__max-icon {
  display: block;
  flex: none;
  width: 24px;
  height: 24px;
  background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22max-gradient%22%20x1%3D%220%22%20y1%3D%22100%22%20x2%3D%22100%22%20y2%3D%220%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20stop-color%3D%22%2300BFFF%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23471AFF%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239500FF%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M50.7571%200.261719C78.2929%200.261719%2099.8857%2022.5974%2099.8857%2050.1474C99.8857%2077.6974%2077.6071%2099.4903%2051.0214%2099.4903C41.5857%2099.4903%2037.0143%2098.1617%2029.65%2092.9474C29.1429%2092.5903%2028.45%2092.6831%2028.0214%2093.1403C22.3571%2099.1831%207.85%20103.426%207.18571%2095.176C7.18571%2080.7903%200%2071.4474%200%2049.876C0%2021.5546%2023.2214%200.261719%2050.7571%200.261719ZM51.5286%2024.8117C38.4643%2024.126%2028.2643%2033.1974%2026.0143%2047.3831C24.15%2059.1332%2027.45%2073.4546%2030.2786%2074.176C31.4786%2074.4832%2034.3571%2072.276%2036.4571%2070.2974C36.85%2069.926%2037.45%2069.8617%2037.9071%2070.1474C41.1786%2072.1474%2044.8786%2073.6474%2048.9571%2073.8617C62.3714%2074.5617%2074.2571%2064.0617%2074.9643%2050.6474C75.6643%2037.2331%2064.9429%2025.5046%2051.5286%2024.8046V24.8117Z%22%20fill%3D%22url(%23max-gradient)%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
}

.kt-hotline-slot .kt-hotline__call svg {
  display: block;
  flex: none;
  width: 20px;
  height: 20px;
}

.kt-hotline-slot .kt-hotline__note {
  grid-column: 1;
  grid-row: 2;
  margin: 0;
  padding: 0;
  color: #6d7884;
  font: 400 12px/1.4 "KT Hotline Acrom", Arial, sans-serif;
  letter-spacing: normal;
  text-align: center;
}

/* Respond to the available column width, not only the device width. */
@container kt-hotline (max-width: 1000px) {
  .kt-hotline-slot .kt-hotline {
    grid-template-columns: 52px minmax(0, 1fr);
    row-gap: 22px;
  }
  .kt-hotline-slot .kt-hotline__contact {
    grid-column: 2;
    justify-self: start;
  }
}

@container kt-hotline (max-width: 760px) {
  .kt-hotline-slot .kt-hotline {
    grid-template-columns: 40px minmax(0, 1fr);
    gap: 14px;
    padding: 22px;
  }

  .kt-hotline-slot .kt-hotline__icon {
    width: 40px;
    height: 40px;
    align-self: start;
    margin-top: 2px;
  }

  .kt-hotline-slot .kt-hotline__title { font-size: 20px; }
  .kt-hotline-slot .kt-hotline__description { font-size: 14px; }
  .kt-hotline-slot .kt-hotline__call { font-size: 18px; }

  .kt-hotline-slot .kt-hotline__contact {
    grid-column: 1 / -1;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    justify-self: stretch;
    min-width: 0;
    align-items: stretch;
    margin-top: 4px;
  }
}

@container kt-hotline (max-width: 500px) {
  .kt-hotline-slot .kt-hotline__contact { grid-template-columns: minmax(0, 1fr); }
  .kt-hotline-slot .kt-hotline__max { grid-column: 1; grid-row: 3; margin-top: 10px; }
}

    .kt-hotline-slot .kt-hotline { grid-template-columns: 52px minmax(0, 1fr); row-gap: 22px; }

    .kt-hotline-slot .kt-hotline__description { font-size: 14px; }
    .kt-hotline-slot .kt-hotline__call { font-size: 18px; }
    .kt-hotline-slot .kt-hotline__contact {
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
