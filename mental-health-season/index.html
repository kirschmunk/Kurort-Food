<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Баннер сезона ментального здоровья в Белокурихе">
  <title>Ментальное здоровье — баннер</title>
  <link rel="stylesheet" href="banner.css">
  <style>
    html, body { min-height: 100%; }
    body { margin: 0; padding: 42px 24px; display: grid; place-items: center; background: #f3f5f4; font-family: Arial, Helvetica, sans-serif; }
    .preview-shell { width: min(1460px, 100%); }
    @media (max-width: 680px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <main class="preview-shell">
    <a class="mental-season-banner" href="https://belokurikha.ru/sales/mentalnoe-zdorove/" aria-label="Открыть страницу акции «Ментальное здоровье»">
      <span class="mental-season-banner__photo" role="img" aria-label="Отдых в акватермальном комплексе Белокурихи"></span>
      <span class="mental-season-banner__gradient" aria-hidden="true"></span>
      <span class="mental-season-banner__content">
        <span class="mental-season-banner__date">
          <svg class="mental-season-banner__icon" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 4.5c.8 5.1 3.9 8.2 9 9-5.1.8-8.2 3.9-9 9-.8-5.1-3.9-8.2-9-9 5.1-.8 8.2-3.9 9-9Z"/><path d="M21.5 3.5v4M23.5 5.5h-4"/></svg>
          <span>4 ноября — 24 декабря 2026</span>
        </span>
        <span class="mental-season-banner__title">Ментальное<br>здоровье</span>
        <span class="mental-season-banner__subtitle">Сезон заботы о себе</span>
        <span class="mental-season-banner__copy">Иногда лучший способ двигаться дальше — сделать паузу, восстановить силы и внутренний баланс.</span>
        <span class="mental-season-banner__features" aria-label="Преимущества сезона"><span>Подарки</span><span>Акватермальный комплекс</span><span>Практики</span><span>Скидки</span></span>
        <span class="mental-season-banner__action">Перезагрузиться <span aria-hidden="true">→</span></span>
      </span>
    </a>
  </main>
</body>
</html>
